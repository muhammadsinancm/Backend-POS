openapi: 3.0.3
info:
  title: Restaurant POS API
  version: 1.0.0
  description: API documentation for the Restaurant POS backend. Supports Owner, Cashier,
    Kitchen, and Waiter roles.
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/POSLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/POSLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/POSLogin'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/POSLogin'
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usezr'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/menu/permission-test/:
    get:
      operationId: menu_permission_test_retrieve
      tags:
      - menu
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: menu_permission_test_create
      tags:
      - menu
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
components:
  schemas:
    POSLogin:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    RoleEnum:
      enum:
      - owner
      - cashier
      - kitchen
      - waiter
      type: string
      description: |-
        * `owner` - Owner
        * `cashier` - Cashier
        * `kitchen` - Kitchen
        * `waiter` - Waiter
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    Usezr:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
      required:
      - email
      - first_name
      - id
      - last_name
      - role
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
